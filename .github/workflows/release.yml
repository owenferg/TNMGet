name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: VERSION=1.0.${{ github.run_number }} ./build.sh
      - name: Package
        run: ditto -c -k --keepParent oGet.app oGet.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" oGet.zip \
            --title "oGet 1.0.${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --generate-notes \
            --latest
